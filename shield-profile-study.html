<!doctype html><html><head><meta charset="utf-8"><title>Shield profile study</title><style>body{background:#647d59;color:#eee;font:14px system-ui;margin:20px}canvas{image-rendering:pixelated;background:#647d59;border:1px solid #344b34;width:780px;max-width:100%}</style></head><body><h1>Shield edges: left and right</h1><canvas id="study" width="780" height="480"></canvas><script src="dunmere-player-frames.js?v=11"></script><script src="dunmere-character-system.js?v=21"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
function draw(){ctx.fillStyle='#647d59';ctx.fillRect(0,0,780,480);ctx.font='14px system-ui';ctx.fillStyle='#f3e8c9';for(let d=0;d<2;d++)for(let h=0;h<2;h++){const dir=d?'right':'left',shield=h?'ironShield':'woodShield',cy=d*230+h*105;ctx.fillText(dir+' · '+shield,10,cy+20);for(let f=0;f<3;f++){const x=64+f*95,y=cy+88;KingdomCharacterSystem.render(ctx,12,x/64,y/64,64,dir,f>0,f*180,{bodyType:'male',handItem:'ironSword',offhandItem:shield,gear:{head:'plateHelm',torso:'plateCuirass',legs:'ironGreaves',hands:'ironGauntlets',feet:'ironBoots'}})}}requestAnimationFrame(draw)}draw();
</script></body></html>

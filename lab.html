<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Kingdom | Living Village Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#171e1a;color:#efe7d2;font:15px system-ui}header{background:#28372e;padding:15px;border-bottom:2px solid #a18b63}h1{font-size:21px;margin:0 0 5px}h2{font-size:16px;margin:0 0 12px}small,.muted{color:#b8b6a6}main{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#263029;border:1px solid #5d6757;border-radius:10px;padding:14px;min-width:0}button,select{border:1px solid #c1a879;border-radius:7px;background:#4b5947;color:#fff2d5;padding:10px;font:inherit;cursor:pointer}button:active{background:#7c7555}button:disabled{opacity:.4}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.person{padding:10px;border-bottom:1px solid #4a5449;cursor:pointer}.person.selected{background:#52624c}.person .meta{font-size:12px;color:#c6c5b6}#people{max-height:420px;overflow:auto}#log{height:330px;overflow:auto}.event{padding:9px 0;border-bottom:1px solid #455044;font-size:13px}.event b{color:#e6c889}.tag{display:inline-block;border:1px solid #837b61;padding:3px 6px;border-radius:5px;font-size:12px;margin:3px}.meter{height:7px;background:#161e18;border-radius:6px;overflow:hidden;margin:4px 0 9px}.meter i{display:block;height:100%;background:#b7a46e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}#summary{display:flex;gap:15px;flex-wrap:wrap;font-size:13px}.wide{grid-column:1/-1}#details{min-height:150px}#explain{color:#d6c59f;font-size:13px}#seed{width:95px;background:#17221b;color:white;border:1px solid #7b826e;padding:8px;border-radius:5px}@media(max-width:650px){main{grid-template-columns:1fr}.wide{grid-column:auto}} </style></head><body>
<header><h1>PROJECT KINGDOM · Living Village Lab</h1><small>20 autonomous villagers · needs, values, relationships, memories, and daily decisions</small><div class="controls"><button id="day">Advance 1 day</button><button id="week">Advance 7 days</button><button id="month">Advance 30 days</button><button id="reset">Reset world</button><label>Seed <input id="seed" type="number" value="1427"></label></div><p id="summary"></p></header>
<main><section class="panel"><h2>Villagers</h2><div id="people"></div></section><section class="panel"><h2>Selected character</h2><div id="details"></div></section><section class="panel wide"><h2>Village event history</h2><div id="log"></div></section></main>
<script>
"use strict";
const names=['Aldric','Edda','Mira','Borin','Tessa','Nell','Garrick','Rowan','Marta','Edric','Oswin','Elara','Hugh','Anwen','Leofric','Sera','Dunstan','Iris','Cedric','Bea'];
const jobs=['farmer','healer','merchant','smith','trader','herbalist','guard','laborer','farmer','farmer','carpenter','weaver','miller','cook','guard','tanner','miner','shepherd','woodcutter','baker'];
let state,selected=0,rng;
function randomSeed(seed){let x=(seed>>>0)||1;return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
const roll=()=>rng(),between=(a,b)=>a+Math.floor(roll()*(b-a+1)),clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
function init(){rng=randomSeed(Number(document.querySelector('#seed').value));state={day:0,people:[],events:[],food:110,harvest:0,shortages:0,marketPrice:2,scarcityDays:0};for(let i=0;i<20;i++){const p={id:i,name:names[i],job:jobs[i],traits:{sociability:between(15,90),cooperation:between(15,90),discipline:between(20,95),boldness:between(10,95)},values:{wealth:between(10,90),honor:between(10,90),community:between(10,90)},needs:{hunger:between(5,35),fatigue:between(5,35),belonging:between(15,65)},wealth:between(3,12),personalFood:between(0,2),awareness:0,plan:'Routine',mood:50,relations:{},memories:[],goal:'Get established',activity:'Resting'};state.people.push(p)}for(const p of state.people)for(const q of state.people)if(p.id!==q.id)p.relations[q.id]={trust:between(-12,25),affinity:between(-20,25)};selected=0;record('A village of 20 people begins its own history.',null);render()}
function record(text,ids){state.events.unshift({day:state.day,text,ids});state.events=state.events.slice(0,500)}
function remember(p,other,kind,detail,impact){p.memories.unshift({day:state.day,other:other?.id??null,kind,detail,impact});p.memories=p.memories.slice(0,25)}
function adjust(p,q,trust,affinity){const r=p.relations[q.id];r.trust=clamp(r.trust+trust,-100,100);r.affinity=clamp(r.affinity+affinity,-100,100)}
function choose(options){const best=Math.max(...options.map(o=>o.score));const weights=options.map(o=>Math.exp((o.score-best)/13));let n=roll()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<options.length;i++){n-=weights[i];if(n<=0)return options[i]}return options.at(-1)}
function day(){state.day++;const startFood=state.food;const shortage=state.food<state.people.length*3;state.scarcityDays=shortage?state.scarcityDays+1:0;state.marketPrice=shortage?Math.min(8,2+Math.floor(state.scarcityDays/3)):2;if(shortage&&state.scarcityDays===1)record('Food reserves are low. Villagers begin responding to scarcity.',null);let fed=0,unfed=0,harvested=0;const order=[...state.people].sort(()=>roll()-.5);for(const p of order){p.needs.hunger=clamp(p.needs.hunger+between(11,19));p.needs.fatigue=clamp(p.needs.fatigue+between(8,15));p.needs.belonging=clamp(p.needs.belonging+between(3,8));if(state.food>0){state.food--;fed++;p.needs.hunger=clamp(p.needs.hunger-43)}else if(p.personalFood>0){p.personalFood--;fed++;p.needs.hunger=clamp(p.needs.hunger-43)}else{unfed++;p.needs.hunger=clamp(p.needs.hunger+22)}p.needs.fatigue=clamp(p.needs.fatigue-24);if(p.job==='farmer'){const crop=between(7,11);state.food+=crop;harvested+=crop;p.needs.fatigue=clamp(p.needs.fatigue+12);p.activity='Tending fields'}p.awareness=clamp(p.awareness+(shortage?between(12,25):-between(10,20)));const crisis=p.awareness>35&&shortage;if(crisis){const responses=[{kind:'farm',score:(p.job==='farmer'?80:35)+p.traits.discipline*.4+p.values.community*.3},{kind:'trade',score:(['merchant','trader'].includes(p.job)?90:15)+p.values.wealth*.35+p.traits.sociability*.25},{kind:'share',score:p.values.community*.75+p.traits.cooperation*.4+(p.personalFood>0?20:-70)},{kind:'hoard',score:p.values.wealth*.65+(100-p.values.community)*.4+(p.wealth>3?20:-30)},{kind:'petition',score:p.traits.sociability*.55+p.values.community*.5},{kind:'stealFood',score:p.needs.hunger*.9+(100-p.values.honor)*.5+(p.traits.boldness*.25)}];const response=choose(responses).kind;p.plan={farm:'Increase food production',trade:'Seek grain through trade',share:'Share private provisions',hoard:'Secure private reserves',petition:'Organize village rationing',stealFood:'Take food from another household'}[response];if(response==='farm'){const gain=between(2,6);state.food+=gain;harvested+=gain;p.needs.fatigue=clamp(p.needs.fatigue+14);if(roll()<.25)record(p.name+' worked extra hours to grow '+gain+' food.',[p.id])}else if(response==='trade'&&p.wealth>=state.marketPrice){const gain=between(2,5);p.wealth-=state.marketPrice;state.food+=gain;record(p.name+' traded '+state.marketPrice+' coins for '+gain+' grain.',[p.id])}else if(response==='share'&&p.personalFood>0){p.personalFood--;state.food++;record(p.name+' donated private food to the village.',[p.id])}else if(response==='hoard'&&state.food>1&&p.wealth>0){state.food--;p.personalFood++;p.wealth--;record(p.name+' bought food for private storage as shortages spread.',[p.id])}else if(response==='petition'){const bonus=state.people.filter(q=>q.values.community>65).length>6?2:1;state.food+=bonus;record(p.name+' organized neighbors to forage and ration supplies (+'+bonus+' food).',[p.id])}else if(response==='stealFood'){const targets=state.people.filter(q=>q.id!==p.id&&q.personalFood>0);if(targets.length){const q=targets[between(0,targets.length-1)];if(roll()<.55){q.personalFood--;p.personalFood++;remember(p,q,'theft','Stole food from '+q.name,0);record(p.name+' stole food from '+q.name+' without being caught.',[p.id,q.id])}else{adjust(q,p,-20,-15);remember(q,p,'theft','Caught '+p.name+' attempting to steal food',-15);record(q.name+' caught '+p.name+' trying to steal food.',[p.id,q.id])}}}}else p.plan='Routine';const opts=[{kind:'work',score:35+p.traits.discipline*.5+(p.wealth<6?18:0)-p.needs.hunger*.35-p.needs.fatigue*.35},{kind:'eat',score:p.needs.hunger*1.25+(p.values.community*.05)},{kind:'rest',score:p.needs.fatigue*1.2},{kind:'social',score:p.needs.belonging*.8+p.traits.sociability*.35},{kind:'steal',score:(p.needs.hunger*.48)+(p.values.wealth*.55)+(100-p.values.honor)*.42+(p.traits.boldness*.12)-35}];const action=choose(opts).kind;p.activity={work:'Working',eat:'Eating',rest:'Resting',social:'Socializing',steal:'Seeking an opportunity'}[action];if(action==='work'){p.wealth+=2;if(p.job==='farmer'){const extra=between(1,3);state.food+=extra;harvested+=extra;}p.needs.fatigue=clamp(p.needs.fatigue+8);if(roll()<.09)record(p.name+' completed a productive day as '+p.job+'.',[p.id])}
if(action==='eat'){if(state.food>0){state.food--;p.needs.hunger=clamp(p.needs.hunger-35)}else{p.needs.hunger=clamp(p.needs.hunger+8)}}
if(action==='rest')p.needs.fatigue=clamp(p.needs.fatigue-52);
if(action==='social'){const others=state.people.filter(q=>q.id!==p.id);const q=choose(others.map(q=>({person:q,score:30+p.relations[q.id].affinity*.7+p.relations[q.id].trust*.3+roll()*20}))).person;const favorable=roll()*100 < (p.traits.cooperation+q.traits.cooperation)/2 + p.relations[q.id].affinity*.2;const delta=favorable?between(2,7):-between(3,9);adjust(p,q,Math.sign(delta)*2,delta);adjust(q,p,Math.sign(delta)*2,Math.round(delta*.7));p.needs.belonging=clamp(p.needs.belonging-25);q.needs.belonging=clamp(q.needs.belonging-12);const msg=favorable?p.name+' and '+q.name+' shared a pleasant conversation.':p.name+' and '+q.name+' argued over a disagreement.';remember(p,q,favorable?'bond':'dispute',msg,delta);remember(q,p,favorable?'bond':'dispute',msg,delta);record(msg,[p.id,q.id])}
if(action==='steal'){const targets=state.people.filter(q=>q.id!==p.id&&q.wealth>2);if(targets.length){const q=targets[between(0,targets.length-1)];const noticed=roll()<(.25+(q.traits.boldness*.003));if(!noticed){p.wealth+=2;q.wealth-=2;remember(p,q,'theft','Stole coins from '+q.name,0);record(p.name+' secretly stole coins from '+q.name+'.',[p.id,q.id])}else{adjust(q,p,-25,-20);remember(q,p,'theft','Caught '+p.name+' attempting theft',-20);record(q.name+' caught '+p.name+' trying to steal. Trust collapsed.',[p.id,q.id])}}}
p.mood=clamp(Math.round(78-p.needs.hunger*.38-p.needs.fatigue*.24-p.needs.belonging*.2+(p.values.community>70?4:0)))}state.harvest+=harvested;state.shortages+=unfed;if(unfed)record(unfed+' villagers missed a meal; food reserves are exhausted.',null);if(state.day%7===0)record('Weekly stores: '+startFood+' → '+state.food+' food; '+harvested+' harvested today.',null);
}
function advance(n){for(let i=0;i<n;i++)day();render()}
function meter(label,v){return '<small>'+label+' · '+v+'</small><div class="meter"><i style="width:'+clamp(v)+'%"></i></div>'}
function render(){document.querySelector('#summary').textContent='Day '+state.day+'  ·  Food '+state.food+'  ·  Grain price '+state.marketPrice+'  ·  Harvested '+state.harvest+'  ·  Missed meals '+state.shortages+'  ·  '+state.events.length+' events';const people=document.querySelector('#people');people.replaceChildren();for(const p of state.people){const el=document.createElement('div');el.className='person'+(p.id===selected?' selected':'');el.innerHTML='<b>'+p.name+'</b> <span class="muted">· '+p.job+'</span><div class="meta">'+p.activity+' · Mood '+p.mood+' · Coins '+p.wealth+' · Food '+p.personalFood+'</div>';el.onclick=()=>{selected=p.id;render()};people.append(el)}
const p=state.people[selected],friends=Object.entries(p.relations).sort((a,b)=>b[1].affinity-a[1].affinity),enemies=[...friends].reverse();document.querySelector('#details').innerHTML='<h2>'+p.name+' · '+p.job+'</h2><p>'+p.activity+' · '+p.wealth+' coins · '+p.personalFood+' private food</p><p><b>Current plan:</b> '+p.plan+' · Awareness '+p.awareness+'/100</p><div class="grid"><div>'+meter('Sociability',p.traits.sociability)+meter('Cooperation',p.traits.cooperation)+meter('Discipline',p.traits.discipline)+meter('Boldness',p.traits.boldness)+'</div><div>'+meter('Honor',p.values.honor)+meter('Wealth value',p.values.wealth)+meter('Community value',p.values.community)+meter('Hunger',p.needs.hunger)+meter('Fatigue',p.needs.fatigue)+'</div></div><p><b>Closest bond:</b> '+names[Number(friends[0][0])]+' ('+friends[0][1].affinity+')<br><b>Most strained:</b> '+names[Number(enemies[0][0])]+' ('+enemies[0][1].affinity+')</p><h2>Personal memories</h2>'+(p.memories.length?p.memories.slice(0,8).map(m=>'<div class="event">Day '+m.day+': '+m.detail+'</div>').join(''):'<small>No notable memories yet.</small>')+'<p id="explain">Behavior is selected from weighted needs, values, traits, and relationships. The same starting seed reproduces the same simulation sequence.</p>';
document.querySelector('#log').innerHTML=state.events.slice(0,80).map(e=>'<div class="event"><b>Day '+e.day+'</b> · '+e.text+'</div>').join('')}
document.querySelector('#day').onclick=()=>advance(1);document.querySelector('#week').onclick=()=>advance(7);document.querySelector('#month').onclick=()=>advance(30);document.querySelector('#reset').onclick=init;init();
</script></body></html>

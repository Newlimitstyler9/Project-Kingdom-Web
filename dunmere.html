<div id="hud"><b>VEYRA · DUNMERE</b><small id="status">Year 874 AC · Day 1</small><small id="hint">Approach the forge door</small></div><button id="journal">Journal</button><div id="joy"><div id="knob"></div></div><button id="a">A</button><div id="dialog"><h3 id="title"></h3><p id="message"></p><div id="choices"></div></div>
<script>
const svgNS='http://www.w3.org/2000/svg',by=id=>document.getElementById(id);let inside=false,p={x:320,y:366},stick=[0,0],pointer=null,day=1,food=4,coins=5,events=[],time=0;
const people=[{name:'Aldric',x:466,y:352,ix:367,iy:220,color:'#805846',trust:0,goal:'Repair the mill axle',needs:4},{name:'Marta',x:130,y:375,ix:350,iy:328,color:'#657e52',trust:0,goal:'Move grain to market',needs:2},{name:'Oswin',x:555,y:375,ix:410,iy:330,color:'#77718d',trust:0,goal:'Reopen the bridge route',needs:5}];
function sprite(parent,x,y,color,name){const g=document.createElementNS(svgNS,'g');g.setAttribute('transform','translate('+x+' '+y+')');g.style.color=color;const u=document.createElementNS(svgNS,'use');u.setAttribute('href','#pawn');g.append(u);const label=document.createElementNS(svgNS,'text');label.setAttribute('y','-31');label.setAttribute('text-anchor','middle');label.setAttribute('font-size','13');label.setAttribute('fill','#fff0d0');label.setAttribute('stroke','#283329');label.setAttribute('stroke-width','3');label.setAttribute('paint-order','stroke');label.textContent=name;g.append(label);parent.append(g);return g}
const out=sprite(by('outplayer'),p.x,p.y,'#527d9d','You'),inn=sprite(by('inplayer'),p.x,p.y,'#527d9d','You');people.forEach(n=>{n.o=sprite(by('outnpcs'),n.x,n.y,n.color,n.name);n.i=sprite(by('innpcs'),n.ix,n.iy,n.color,n.name)});
function show(title,msg,opts){by('title').textContent=title;by('message').textContent=msg;const c=by('choices');c.replaceChildren();for(const [text,fn] of opts){const b=document.createElement('button');b.textContent=text;b.onclick=fn;c.append(b)}by('dialog').style.display='block'}function close(){by('dialog').style.display='none'}function note(t){events.unshift('Day '+day+': '+t)}
function talk(n){show(n.name,n.name==='Aldric'?'The mill axle needs iron, but my charcoal supplier has not arrived.':n.name==='Marta'?'The mill has stopped. If it stays broken, the village will run short of flour.':'The bridge tolls are ruining my trade. I need a trustworthy messenger.',[['Ask what they need',()=>show(n.name,n.goal+'. I need '+n.needs+' supplies before I can make progress.',[['Continue',close]])],['Offer help · Persuasion +2',()=>{const d=1+Math.floor(Math.random()*20),ok=d+2>=12;if(ok){n.trust+=8;note(n.name+' accepted your help.')}show('Skill check','Rolled '+d+' + 2 against DC 12. '+(ok?'You earned some trust.':'They are not convinced yet.'),[['Continue',close]])}],['Give food',()=>{if(food>0){food--;n.trust+=5;note('You shared food with '+n.name)}show(n.name,food>=0?'Your kindness is remembered.':'You have no food.',[['Continue',close]])}],['Leave',close]])}
function interact(){if(by('dialog').style.display==='block'){close();return}if(inside){if(Math.hypot(p.x-320,p.y-393)<43){inside=false;p={x:320,y:327};by('outside').setAttribute('visibility','visible');by('inside').setAttribute('visibility','hidden');return}const n=people[0];if(Math.hypot(p.x-n.ix,p.y-n.iy)<75)talk(n);else show('Workshop','Walk closer to Aldric, or return to the door.',[['OK',close]]);return}if(Math.hypot(p.x-320,p.y-307)<46){inside=true;p={x:320,y:360};by('outside').setAttribute('visibility','hidden');by('inside').setAttribute('visibility','visible');return}const n=people.find(n=>Math.hypot(p.x-n.x,p.y-n.y)<66);if(n)talk(n);else show('Dunmere','Approach a person or the forge door to interact.',[['OK',close]])}
by('a').onclick=interact;by('journal').onclick=()=>show('Your journal','Day '+day+' · '+coins+' coins · '+food+' food.\n'+(events.join('\n')||'You arrived alone in Dunmere.'),[['Close',close]]);
function touch(e){const r=by('joy').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),v=Math.min(38,d);stick=d>10?[x/d*v/38,y/d*v/38]:[0,0];by('knob').style.transform='translate('+stick[0]*38+'px,'+stick[1]*38+'px)'}
by('joy').onpointerdown=e=>{pointer=e.pointerId;by('joy').setPointerCapture(pointer);touch(e)};by('joy').onpointermove=e=>{if(pointer===e.pointerId)touch(e)};function release(e){if(pointer===e.pointerId){pointer=null;stick=[0,0];by('knob').style.transform=''}}by('joy').onpointerup=release;by('joy').onpointercancel=release;
const collides=(x,y)=>inside?(x<95||x>545||y<83||y>396||(x>99&&x<218&&y>98&&y<213)||(x>410&&x<526&&y>95&&y<189)||(x>235&&x<342&&y>199&&y<281)||(x>106&&x<227&&y>279&&y<353)||(x>410&&x<525&&y>265&&y<349)):(x<20||x>620||y<45||y>455||(x>184&&x<450&&y>119&&y<310));
let prev=performance.now();function frame(now){const dt=Math.min(.04,(now-prev)/1000);prev=now;if(by('dialog').style.display!=='block'){let nx=p.x+stick[0]*92*dt,ny=p.y+stick[1]*92*dt;if(!collides(nx,p.y))p.x=nx;if(!collides(p.x,ny))p.y=ny}time+=dt;if(time>8){time=0;day++;people.forEach((n,i)=>{n.x+=(Math.sin(day+i)*9);n.y+=(Math.cos(day+i)*6);n.o.setAttribute('transform','translate('+n.x+' '+n.y+')')})}out.setAttribute('transform','translate('+p.x+' '+p.y+')');inn.setAttribute('transform','translate('+p.x+' '+p.y+')');by('status').textContent='Year 874 AC · Day '+day+' · Food '+food+' · Coins '+coins;by('hint').textContent=inside?'Talk to Aldric or approach the door':'Explore, talk, and enter the forge';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>

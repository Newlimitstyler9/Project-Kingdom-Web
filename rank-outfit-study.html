<!doctype html><html><head><meta charset="utf-8"><title>Greyford rank outfits</title><style>body{background:#506950;color:#f5e5bf;font:14px system-ui;margin:20px}canvas{image-rendering:pixelated;background:#617b5d;border:1px solid #344b34;width:900px;max-width:100%}</style></head><body><h1>Greyford clothing by standing</h1><canvas id="study" width="900" height="540"></canvas><script src="dunmere-player-frames.js?v=11"></script><script src="dunmere-character-system.js?v=23"></script><script src="greyford-world.js?v=16"></script><script>
const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
const people=['maera','alda','jorin','jessa'].map(id=>GreyfordWorld.people.find(p=>p.id===id));
function draw(){ctx.fillStyle='#617b5d';ctx.fillRect(0,0,900,540);ctx.fillStyle='#f8ebcb';ctx.font='15px system-ui';people.forEach((person,i)=>{const y=45+i*128;ctx.fillText(person.name+' · '+person.status,12,y);['down','left','right','up'].forEach((dir,d)=>{const size=68,x=185+d*174;KingdomCharacterSystem.render(ctx,person.sprite,x/size,(y+56)/size,size,dir,true,150,{bodyType:person.sex,sprite:person.sprite,...GreyfordWorld.outfit(person)});ctx.fillText(dir,x-23,y+103)})});requestAnimationFrame(draw)}draw();
</script></body></html>

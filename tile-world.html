<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kingdom Tile Test</title><style>body{margin:0;overflow:hidden;background:#24382b;color:#fff0d2;font:13px system-ui;touch-action:none}canvas{width:100vw;height:100dvh;display:block}button{background:#405846;color:#fff0d2;border:1px solid #d2b88c;border-radius:9px;padding:10px}#hud{position:absolute;top:8px;left:8px;background:#172a20dc;padding:10px;border-radius:8px}#tools{position:absolute;right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:60%;justify-content:flex-end}#joy{position:absolute;bottom:20px;left:20px;width:122px;height:122px;border:3px solid #ddc494;border-radius:50%;background:#203b45b0}#knob{position:absolute;top:41px;left:41px;width:36px;height:36px;border-radius:50%;background:#dfc99d}#a{position:absolute;bottom:45px;right:22px;width:74px;height:74px;border-radius:50%;font-size:22px;background:#875744}#dialog{display:none;position:absolute;bottom:155px;left:8%;right:8%;background:#20372b;border:2px solid #ddc494;border-radius:10px;padding:14px;z-index:5}#dialog button{margin:5px}@media(orientation:landscape){#dialog{left:25%;right:25%;bottom:15px}}</style><canvas id="c"></canvas><div id="hud"><b>VEYRA · DUNMERE</b><div id="info">Continuous tile world</div><div id="resources">Wood 24 · Stone 12</div></div><div id="tools"><button id="mode">Build: OFF</button><button id="wall">Wall</button><button id="door">Door</button><button id="floor">Floor</button><button id="zoom">Zoom +</button></div><div id="joy"><div id="knob"></div></div><button id="a">A</button><div id="dialog"><h3 id="title"></h3><p id="msg"></p><div id="choices"></div></div><script src="village-sim.js"></script><script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),N=36,M=28,tile=36;let zoom=1.25,build=false,tool='wall',wood=24,player={x:17.5,y:19.5},stick=[0,0],pid=null,cam=[0,0],last=performance.now(),simAccumulator=0;const map=Array.from({length:M},()=>Array.from({length:N},()=>({wall:false,door:false,floor:false,roof:false,prop:''})));const get=(x,y)=>map[y]?.[x];function house(x,y,w,h,dx){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){let c=get(i,j);c.floor=true;c.roof=true;c.wall=i===x||j===y||i===x+w-1||j===y+h-1}let c=get(dx,y+h-1);c.wall=false;c.door=true}house(12,8,11,9,17);house(25,10,8,7,28);house(3,11,7,7,6);get(14,11).prop='forge';get(19,12).prop='anvil';get(20,14).prop='table';get(27,12).prop='bed';get(5,13).prop='chest';
const npcs=[{name:'Aldric',x:19.5,y:13.5,color:'#94684f',goal:'Needs charcoal for the forge',home:[19.5,13.5],outside:[20.5,19.5],trust:0},{name:'Marta',x:8.5,y:20.5,color:'#698653',goal:'Needs a repaired mill axle',home:[6.5,14.5],outside:[8.5,20.5],trust:0},{name:'Oswin',x:29.5,y:19.5,color:'#8a7b9b',goal:'Needs safe passage for caravans',home:[28.5,13.5],outside:[29.5,19.5],trust:0}];KingdomVillage.start(npcs);const trees=[];for(let i=0;i<45;i++){let x=(i*17+3)%N,y=(i*11+5)%M;if(!get(x,y).roof&&Math.hypot(x-17,y-19)>5)trees.push([x,y])}
function route(sx,sy,tx,ty){const start=[Math.floor(sx),Math.floor(sy)],goal=[Math.floor(tx),Math.floor(ty)],key=(x,y)=>x+','+y,queue=[start],seen=new Set([key(...start)]),parents=new Map();for(let i=0;i<queue.length;i++){const [x,y]=queue[i];if(x===goal[0]&&y===goal[1]){const path=[];let k=key(x,y);while(parents.has(k)){const [px,py]=k.split(',').map(Number);path.unshift([px+.5,py+.5]);k=parents.get(k)}return path}for(const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!seen.has(k)&&!blocked(nx+.5,ny+.5)){seen.add(k);parents.set(k,key(x,y));queue.push([nx,ny])}}}return []}const blocked=(x,y)=>{const c=get(Math.floor(x),Math.floor(y));return !c||c.wall||trees.some(t=>Math.abs(t[0]+.5-x)<.32&&Math.abs(t[1]+.5-y)<.32)};const pass=(x,y)=>!blocked(x-.18,y-.18)&&!blocked(x+.18,y-.18)&&!blocked(x-.18,y+.18)&&!blocked(x+.18,y+.18);
function draw(){const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);const s=tile*zoom;cam=[player.x*s-w/2,player.y*s-h/2];ctx.fillStyle='#70875b';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(-cam[0],-cam[1]);const x0=Math.max(0,Math.floor(cam[0]/s)-1),x1=Math.min(N,Math.ceil((cam[0]+w)/s)+1),y0=Math.max(0,Math.floor(cam[1]/s)-1),y1=Math.min(M,Math.ceil((cam[1]+h)/s)+1);
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=get(x,y),px=x*s,py=y*s;ctx.fillStyle=(y>=18&&y<=20||x===17&&y>=16&&y<=23)?'#a48a67':'#70875b';ctx.fillRect(px,py,s+1,s+1);if(c.floor){ctx.fillStyle='#a27d55';ctx.fillRect(px,py,s,s);ctx.strokeStyle='#765b41';ctx.beginPath();ctx.moveTo(px,py+s*.5);ctx.lineTo(px+s,py+s*.5);ctx.stroke()}}
for(const [x,y] of trees){ctx.fillStyle='#594431';ctx.fillRect((x+.42)*s,(y+.4)*s,s*.17,s*.5);ctx.fillStyle='#3c6745';ctx.beginPath();ctx.arc((x+.5)*s,(y+.36)*s,s*.42,0,7);ctx.fill()}
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=get(x,y),px=x*s,py=y*s;if(c.wall){ctx.fillStyle='#5a5144';ctx.fillRect(px,py,s,s);ctx.fillStyle='#998c72';ctx.fillRect(px+s*.1,py+s*.07,s*.8,s*.75)}if(c.door){ctx.fillStyle='#553c2b';ctx.fillRect(px+s*.1,py,s*.8,s);ctx.fillStyle='#b28b55';ctx.fillRect(px+s*.25,py+s*.1,s*.5,s*.75)}if(c.prop){ctx.fillStyle=c.prop==='forge'?'#54443b':c.prop==='anvil'?'#68706d':'#76533b';ctx.fillRect(px+s*.1,py+s*.18,s*.8,s*.7);if(c.prop==='forge'){ctx.fillStyle='#df903e';ctx.beginPath();ctx.arc(px+s*.5,py+s*.48,s*.25,0,7);ctx.fill()}}}
function actor(x,y,color,name){let px=x*s,py=y*s;ctx.fillStyle=color;ctx.fillRect(px-s*.16,py-s*.08,s*.32,s*.37);ctx.fillStyle='#d9b18c';ctx.beginPath();ctx.arc(px,py-s*.2,s*.15,0,7);ctx.fill();ctx.font='bold '+Math.max(11,s*.25)+'px system-ui';ctx.textAlign='center';ctx.strokeStyle='#25352b';ctx.lineWidth=3;ctx.strokeText(name,px,py-s*.48);ctx.fillStyle='#fff2d5';ctx.fillText(name,px,py-s*.48)}
npcs.forEach(n=>actor(n.x,n.y,n.color,n.name));actor(player.x,player.y,'#527fa0','You');
const inRoom=get(Math.floor(player.x),Math.floor(player.y))?.floor;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const c=get(x,y);if(!c.roof||c.wall||c.door)continue;if(inRoom&&Math.abs(x-player.x)<12&&Math.abs(y-player.y)<10)continue;ctx.fillStyle='#765844';ctx.fillRect(x*s,y*s,s+1,s+1);ctx.strokeStyle='#aa8060';ctx.beginPath();ctx.moveTo(x*s,y*s+s*.2);ctx.lineTo((x+1)*s,y*s+s*.2);ctx.stroke()}
if(build){ctx.strokeStyle='#e4d5ac88';ctx.lineWidth=1;for(let x=x0;x<=x1;x++){ctx.beginPath();ctx.moveTo(x*s,y0*s);ctx.lineTo(x*s,y1*s);ctx.stroke()}for(let y=y0;y<=y1;y++){ctx.beginPath();ctx.moveTo(x0*s,y*s);ctx.lineTo(x1*s,y*s);ctx.stroke()}}ctx.restore()}
function show(title,msg,options){$('title').textContent=title;$('msg').textContent=msg;const box=$('choices');box.replaceChildren();options.forEach(([t,fn])=>{let b=document.createElement('button');b.textContent=t;b.onclick=fn;box.append(b)});$('dialog').style.display='block'}const close=()=>$('dialog').style.display='none';
$('a').onclick=()=>{if($('dialog').style.display==='block'){close();return}let n=npcs.find(n=>Math.hypot(n.x-player.x,n.y-player.y)<1.8);if(n)show(n.name,n.goal+'. Trust: '+n.trust,[['Offer help',()=>{n.trust+=5;show(n.name,'I will remember your offer. Trust +5.',[['Continue',close]])}],['Leave',close]]);else show('Dunmere','Walk through a doorway to enter a building. No loading screen.',[['OK',close]])};
$('mode').onclick=()=>{build=!build;$('mode').textContent='Build: '+(build?'ON':'OFF')};for(const t of ['wall','door','floor'])$(t).onclick=()=>{tool=t;build=true;$('mode').textContent='Build: ON'};$('zoom').onclick=()=>{zoom=zoom>=2?1:zoom+.25};
cv.onpointerdown=e=>{if(!build)return;const s=tile*zoom,x=Math.floor((e.clientX+cam[0])/s),y=Math.floor((e.clientY+cam[1])/s),c=get(x,y);if(!c||Math.hypot(x+.5-player.x,y+.5-player.y)<1||npcs.some(n=>Math.floor(n.x)===x&&Math.floor(n.y)===y))return;const cost=tool==='door'?3:tool==='wall'?2:1;if(wood<cost)return;if(tool==='wall'&&c.wall||tool==='door'&&c.door||tool==='floor'&&c.floor)return;wood-=cost;if(tool==='wall'){c.wall=true;c.door=false}else if(tool==='door'){c.door=true;c.wall=false}else c.floor=true;$('resources').textContent='Wood '+wood+' · Stone 12'};
function touch(e){const r=$('joy').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.hypot(x,y),k=Math.min(m,40);stick=m>12?[x/m*k/40,y/m*k/40]:[0,0];$('knob').style.transform='translate('+stick[0]*40+'px,'+stick[1]*40+'px)'}$('joy').onpointerdown=e=>{pid=e.pointerId;$('joy').setPointerCapture(pid);touch(e)};$('joy').onpointermove=e=>{if(pid===e.pointerId)touch(e)};const release=e=>{if(pid===e.pointerId){pid=null;stick=[0,0];$('knob').style.transform=''}};$('joy').onpointerup=release;$('joy').onpointercancel=release;
function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;if($('dialog').style.display!=='block'&&!build){let nx=player.x+stick[0]*3*dt,ny=player.y+stick[1]*3*dt;if(pass(nx,player.y))player.x=nx;if(pass(player.x,ny))player.y=ny}simAccumulator+=dt;while(simAccumulator>=.5){KingdomVillage.tick(npcs,.25);simAccumulator-=.5}npcs.forEach((n,i)=>{const target=n.taskTarget||n.home,goal=target.join(','),tileNow=Math.floor(n.x)+','+Math.floor(n.y);if(n.goalKey!==goal||n.pathFrom!==tileNow||!n.path){n.path=route(n.x,n.y,target[0],target[1]);n.goalKey=goal;n.pathFrom=tileNow}if(n.path.length){const waypoint=n.path[0],dx=waypoint[0]-n.x,dy=waypoint[1]-n.y,d=Math.hypot(dx,dy);if(d<.08){n.path.shift();n.pathFrom=Math.floor(n.x)+','+Math.floor(n.y)}else{const step=Math.min(d,.9*dt),nx=n.x+dx/d*step,ny=n.y+dy/d*step;if(pass(nx,ny)){n.x=nx;n.y=ny}else{n.path=[];n.pathFrom='blocked'}}}});$('info').textContent='Day '+KingdomVillage.world.day+' · '+Math.floor(KingdomVillage.world.hour)+':00 · '+npcs.map(n=>n.name+': '+n.currentTask).join(' | ');$('resources').textContent='Food '+KingdomVillage.world.food+' · Charcoal '+KingdomVillage.world.charcoal+' · Iron '+KingdomVillage.world.iron+' · Tools '+KingdomVillage.world.tools+' · Wood '+wood;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>

<!doctype html><html><head><meta charset="utf-8"><title>Held equipment front/back study</title><style>body{background:#647d59;color:#eee;font:14px system-ui;margin:20px}canvas{image-rendering:pixelated;background:#647d59;border:1px solid #344b34;width:1120px;max-width:100%}</style></head><body><h1>Held equipment: down and up</h1><canvas id="study" width="1120" height="770"></canvas><script src="dunmere-player-frames.js?v=11"></script><script src="dunmere-character-system.js?v=23"></script><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const items=['axe','ironAxe','steelAxe','ironSword','steelSword','knife','pick','hoe','spear','torch'];
function draw(){ctx.fillStyle='#647d59';ctx.fillRect(0,0,1120,770);ctx.font='14px system-ui';ctx.fillStyle='#f3e8c9';items.forEach((item,i)=>{const cx=(i%5)*224,cy=Math.floor(i/5)*370;ctx.fillText(item,cx+10,cy+20);for(let d=0;d<2;d++)for(let f=0;f<3;f++){const dir=d?'up':'down';const x=cx+36+f*63,y=cy+130+d*145;KingdomCharacterSystem.render(ctx,12,x/64,y/64,64,dir,f>0,f*180,{bodyType:'male',handItem:item,hair:true,offhandItem:'ironShield',gear:{head:'plateHelm',torso:'plateCuirass',legs:'ironGreaves',hands:'ironGauntlets',feet:'ironBoots'}});ctx.fillText(dir+' '+f,cx+9+f*63,cy+160+d*145)}});requestAnimationFrame(draw)}draw();
</script></body></html>

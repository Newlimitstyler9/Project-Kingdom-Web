function interact(){if($('bagpanel').style.display==='block')return;if($('panel').style.display==='block'){close();return}const fx=player.x+facing[0]*1.15,fy=player.y+facing[1]*1.15;let target=actors.find(a=>Math.hypot(a.x-fx,a.y-fy)<1.3);if(target){converse(target.id,"open");return}if(Math.hypot(fx-actions.node.x,fy-actions.node.y)<1.8&&!actions.snapshot().collected){const result=actions.collect(player.x,player.y);persistActions();bag.reconcile();saveBag();dialog("Charcoal supply",result.message,[["Continue",close]]);return}interactLand()}

function renderBag(){bag.reconcile();$('bagstats').textContent=bag.weight.toFixed(1)+' kg carried · Hand: '+(bag.equipped?bag.defs[bag.equipped].name:'Empty');const grid=$('baggrid');grid.replaceChildren();bag.slots.forEach((item,i)=>{const cell=document.createElement('div');cell.className='bagslot'+(selectedSlot===i?' selected':'');cell.dataset.slot=i;if(item){cell.innerHTML=bag.pixel(item.id)+'<span class="qty">'+(item.count>1?item.count:'')+'</span>'}grid.append(cell)});const menu=$('bagmenu');menu.replaceChildren();const item=bag.slots[selectedSlot];if(item){const label=document.createElement('span');label.textContent=bag.defs[item.id].name+' × '+item.count;label.style.width='100%';menu.append(label);const allowed=['drop',...(bag.defs[item.id].type==='food'?['eat']:[]),...(bag.defs[item.id].slot?['equip']:[])];for(const action of allowed){const btn=document.createElement('button');btn.textContent=action[0].toUpperCase()+action.slice(1);btn.onclick=()=>bagAction(selectedSlot,action);menu.append(btn)}}}

const heldKeys=new Set(),movementKeys=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);

function pointTowardMouse(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*(canvas.clientWidth/r.width),y=(e.clientY-r.top)*(canvas.clientHeight/r.height),worldX=(x+camera[0])/(S*1.3),worldY=(y+camera[1])/(S*1.3),dx=worldX-player.x,dy=worldY-player.y,d=Math.hypot(dx,dy);if(d>.15){facing=[dx/d,dy/d];playerFacing=KingdomPlayerFrames.resolveDirection(playerFacing,dx,dy)}return d}

const JOY_RANGE=44,JOY_DEADZONE=.12;
function updateStick(e){const r=$('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,length=Math.hypot(dx,dy),distance=Math.min(1,length/JOY_RANGE),direction=length?[dx/length,dy/length]:[0,0],power=distance<=JOY_DEADZONE?0:(distance-JOY_DEADZONE)/(1-JOY_DEADZONE);stick=[direction[0]*power,direction[1]*power];$('knob').style.transform='translate('+direction[0]*distance*JOY_RANGE+'px,'+direction[1]*distance*JOY_RANGE+'px)'}

function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;KingdomDebug.frame(dt);if($('panel').style.display!=='block'&&$('bagpanel').style.display!=='block'){const keys=keyboardMove(),move=Math.hypot(...keys)>0?keys:stick,oldX=player.x,oldY=player.y;let nx=player.x+move[0]*3.2*dt,ny=player.y+move[1]*3.2*dt;if(pass(nx,player.y))player.x=nx;if(pass(player.x,ny))player.y=ny;if(Math.hypot(...move)>.2){const d=Math.hypot(...move);facing=[move[0]/d,move[1]/d];playerFacing=KingdomPlayerFrames.resolveDirection(playerFacing,move[0],move[1])}const traveled=Math.hypot(player.x-oldX,player.y-oldY);playerMoving=traveled>.001;playerWalkMs=playerMoving?playerWalkMs+traveled/3.2*1000:0}else{playerMoving=false;playerWalkMs=0}const advancedHours=clock.advance(dt,speed,()=>{survival.hour();const previousDay=world.snapshot().day;world.step((resident,place)=>{const a=actors[resident.id],g=goal(place,resident.id);return Math.hypot(a.x-g[0],a.y-g[1])<.8});if(world.snapshot().day!==previousDay){foodSystem.update(world.snapshot().day);land.advanceDay()}if(world.snapshot().hour===12)hauling.process();hauling.step((id,place)=>{const a=actors[id],g=goal(place,id);return Math.hypot(a.x-g[0],a.y-g[1])<.8});KingdomDebug.counters.simSteps++;});if(advancedHours>0&&world.snapshot().hour%6===0)saveWorld();actors.forEach((a,i)=>{let r=world.residents[i],destination=hauling.destination(i)||r.place,g=goal(destination,i),key=destination;if(a.destination!==key||(a.path.length===0&&Math.hypot(a.x-g[0],a.y-g[1])>.6&&now>=(a.nextRetry||0))){a.path=route(a.x,a.y,g[0],g[1]);a.destination=key;a.nextRetry=now+(a.path.length?400:2500)}if(a.path.length){let p=a.path[0],dx=p[0]-a.x,dy=p[1]-a.y,dist=Math.hypot(dx,dy);if(dist<.08)a.path.shift();else{let step=Math.min(dist,1.6*dt*speed),nx=a.x+dx/dist*step,ny=a.y+dy/dist*step;if(pass(nx,ny)){a.x=nx;a.y=ny}else{KingdomDebug.counters.blockedMoves++;KingdomDebug.add("warn","NPC movement blocked",world.residents[i].name+" at "+a.x.toFixed(2)+","+a.y.toFixed(2));a.path=[];a.nextRetry=now+1200}}}});hauling.step((id,place)=>{const a=actors[id],g=goal(place);return Math.hypot(a.x-g[0],a.y-g[1])<.65});pets.forEach(p=>{let a=actors[p.owner],r=world.residents[p.owner],target=r.activity==='Taking a walk'?a: {x:goal(r.home)[0],y:goal(r.home)[1]};let dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy);if(d>.8){let step=Math.min(d,1.8*dt*speed);let nx=p.x+dx/d*step,ny=p.y+dy/d*step;if(pass(nx,ny)){p.x=nx;p.y=ny}}});let s=world.snapshot();if(devMode&&$('debugpanel').style.display==='block')renderDebug();$('time').textContent='Day '+s.day+' · '+String(s.hour).padStart(2,'0')+':00';$('stock').textContent='Dunmere is an independent settlement';$('activity').textContent='12 residents · '+s.transactions+' transactions · 2 pets';draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);

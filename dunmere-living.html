$('baggrid').addEventListener('pointerup',e=>{if(!bagPointer||bagPointer.id!==e.pointerId)return;const start=bagPointer.from,drag=bagPointer.drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.bagslot');$('bagghost').style.display='none';bagPointer=null;if(drag&&target){bag.move(start,Number(target.dataset.slot));selectedSlot=null;saveBag()}else if(!drag){if(selectedSlot!==null&&selectedSlot!==start&&bag.slots[selectedSlot]){bag.move(selectedSlot,start);selectedSlot=null;saveBag()}else selectedSlot=start}renderBag()});
$('baggrid').addEventListener('pointercancel',()=>{$('bagghost').style.display='none';bagPointer=null});
const heldKeys=new Set(),movementKeys=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight']);
function keyboardMove(){const x=Number(heldKeys.has('KeyD')||heldKeys.has('ArrowRight'))-Number(heldKeys.has('KeyA')||heldKeys.has('ArrowLeft')),y=Number(heldKeys.has('KeyS')||heldKeys.has('ArrowDown'))-Number(heldKeys.has('KeyW')||heldKeys.has('ArrowUp')),length=Math.hypot(x,y);return length?[x/length,y/length]:[0,0]}
function typingIn(target){return target instanceof Element&&!!target.closest('input,textarea,select,[contenteditable]')}
window.addEventListener('keydown',e=>{if(typingIn(e.target)||e.altKey||e.ctrlKey||e.metaKey)return;const code=e.code;if(movementKeys.has(code)||['Space','KeyE','KeyI','KeyM','Escape'].includes(code))e.preventDefault();if(movementKeys.has(code)){heldKeys.add(code);return}if(e.repeat)return;if(code==='KeyE')interact();else if(code==='Space')attack();else if(code==='KeyI')$('inventory').click();else if(code==='KeyM'){if($('bagpanel').style.display==='block'&&activeMenuTab==='map')closeBag();else{if($('bagpanel').style.display!=='block')openBag();activeMenuTab='map';renderMenu()}}else if(code==='Escape'){if($('debugpanel').style.display==='block')$('closedebug').click();else if($('panel').style.display==='block')close();else if($('bagpanel').style.display==='block')closeBag()}});
window.addEventListener('keyup',e=>heldKeys.delete(e.code));
function pointTowardMouse(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*(canvas.clientWidth/r.width),y=(e.clientY-r.top)*(canvas.clientHeight/r.height),roomTransform=roomView(innerWidth,innerHeight),roomX=(x-roomTransform.ox)/roomTransform.size,roomY=(y-roomTransform.oy)/roomTransform.size,worldX=roomId?roomX:(x+camera[0])/(S*1.3),worldY=roomId?roomY:(y+camera[1])/(S*1.3),dx=worldX-(roomId?roomPlayer.x:player.x),dy=worldY-(roomId?roomPlayer.y:player.y),d=Math.hypot(dx,dy);if(d>.15){facing=[dx/d,dy/d];playerFacing=KingdomPlayerFrames.resolveDirection(playerFacing,dx,dy)}return d}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;if(e.button!==0&&e.button!==2)return;const distance=pointTowardMouse(e);if(distance>2.5){$('hint').textContent='Move closer to interact';return}if(e.button===2)attack();else interact()});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const JOY_RANGE=44,JOY_DEADZONE=.12;
function updateStick(e){const r=$('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,length=Math.hypot(dx,dy),distance=Math.min(1,length/JOY_RANGE),direction=length?[dx/length,dy/length]:[0,0],power=distance<=JOY_DEADZONE?0:(distance-JOY_DEADZONE)/(1-JOY_DEADZONE);stick=[direction[0]*power,direction[1]*power];$('knob').style.transform='translate('+direction[0]*distance*JOY_RANGE+'px,'+direction[1]*distance*JOY_RANGE+'px)'}
function stopStick(){pointer=null;stick=[0,0];$('knob').style.transform='translate(0px,0px)'}
$('joy').addEventListener('pointerdown',e=>{if(pointer!==null)return;e.preventDefault();pointer=e.pointerId;$('joy').setPointerCapture(pointer);updateStick(e)});
$('joy').addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;e.preventDefault();updateStick(e)});
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('joy').addEventListener(type,e=>{if(pointer===e.pointerId)stopStick()});
window.addEventListener('blur',()=>{stopStick();heldKeys.clear()});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopStick();heldKeys.clear()}});
function debugState(){const s=world.snapshot();return {day:s.day,hour:s.hour,resources:{grain:s.grain,bread:s.bread,ale:s.ale,treasury:s.treasury},transactions:s.transactions,player:{x:+player.x.toFixed(2),y:+player.y.toFixed(2)},npcs:actors.map((a,i)=>({name:world.residents[i].name,x:+a.x.toFixed(2),y:+a.y.toFixed(2),destination:a.destination,activity:world.residents[i].activity,task:world.residents[i].currentTask,workPriorities:world.residents[i].workPriorities,pathLength:a.path.length})),events:s.logs.slice(0,30),conversation:dialogueAI.snapshot(),playerInventory:actions.snapshot(),foodSimulation:foodSystem.snapshot()}}
function renderDebug(){const d=KingdomDebug;$('debugstats').textContent='FPS '+d.fps+' | Frame '+d.frameMs+'ms | Day '+world.snapshot().day+'\nRoutes '+d.counters.routeAttempts+' | Failed '+d.counters.pathFailures+' | Blocked '+d.counters.blockedMoves+'\nSim steps '+d.counters.simSteps+' | JS errors '+d.counters.jsErrors;$('debuglog').textContent=d.entries.slice(-12).reverse().map(e=>e.level.toUpperCase()+': '+e.message+' '+e.details).join('\n')}
$('debug').onclick=()=>{$('debugpanel').style.display=$('debugpanel').style.display==='block'?'none':'block';renderDebug()};
$('closedebug').onclick=()=>$('debugpanel').style.display='none';
$('copydebug').onclick=async()=>{const ok=await KingdomDebug.copy(debugState());$('copydebug').textContent=ok?'Copied!':'Copy unavailable';};
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;KingdomDebug.frame(dt);if($('panel').style.display!=='block'&&$('bagpanel').style.display!=='block'){const keys=keyboardMove(),move=Math.hypot(...keys)>0?keys:stick,oldX=player.x,oldY=player.y,oldRoomX=roomPlayer.x,oldRoomY=roomPlayer.y;let nx=player.x+move[0]*3.2*dt,ny=player.y+move[1]*3.2*dt;if(roomId){if(seated&&Math.hypot(...move)>.2)seated=false;const room=interiors.get(roomId);if(roomPass(roomPlayer.x+move[0]*3.2*dt,roomPlayer.y))roomPlayer.x+=move[0]*3.2*dt;if(roomPass(roomPlayer.x,roomPlayer.y+move[1]*3.2*dt))roomPlayer.y+=move[1]*3.2*dt}else{if(playerPass(nx,player.y))player.x=nx;if(playerPass(player.x,ny))player.y=ny}if(Math.hypot(...move)>.2){const d=Math.hypot(...move);facing=[move[0]/d,move[1]/d];playerFacing=KingdomPlayerFrames.resolveDirection(playerFacing,move[0],move[1])}const traveled=roomId?Math.hypot(roomPlayer.x-oldRoomX,roomPlayer.y-oldRoomY):Math.hypot(player.x-oldX,player.y-oldY);playerMoving=traveled>.001;playerWalkMs=playerMoving?playerWalkMs+traveled/3.2*1000:0}else{playerMoving=false;playerWalkMs=0}if(roomId==="bakery"&&speed>0)bakeryRoutine.step(dt*Math.min(speed,4),(x,y)=>interiors.pass(interiors.get("bakery"),x,y)&&Math.hypot(x-roomPlayer.x,y-roomPlayer.y)>.58);const advancedHours=clock.advance(dt,speed,()=>{survival.hour();const previousDay=world.snapshot().day;world.step((resident,place)=>{const a=actors[resident.id],g=goal(place,resident.id);return Math.hypot(a.x-g[0],a.y-g[1])<.8});if(world.snapshot().day!==previousDay){foodSystem.update(world.snapshot().day);land.advanceDay()}if(world.snapshot().hour===12)hauling.process();hauling.step((id,place)=>{const a=actors[id],g=goal(place,id);return Math.hypot(a.x-g[0],a.y-g[1])<.8});KingdomDebug.counters.simSteps++;});if(advancedHours>0&&world.snapshot().hour%6===0)saveWorld();actors.forEach((a,i)=>{const oldX=a.x,oldY=a.y;let r=world.residents[i],destination=hauling.destination(i)||r.place,g=goal(destination,i),key=destination;if(a.destination!==key||(a.path.length===0&&Math.hypot(a.x-g[0],a.y-g[1])>.6&&now>=(a.nextRetry||0))){a.path=route(a.x,a.y,g[0],g[1]);a.destination=key;a.nextRetry=now+(a.path.length?400:2500)}if(a.path.length){let p=a.path[0],dx=p[0]-a.x,dy=p[1]-a.y,dist=Math.hypot(dx,dy);if(dist<.08)a.path.shift();else{let step=Math.min(dist,1.6*dt*speed),nx=a.x+dx/dist*step,ny=a.y+dy/dist*step;if(step>0&&!KingdomNpcTraffic.move(actors,i,p,step,pass)){KingdomDebug.counters.blockedMoves++;if(!pass(nx,ny)){KingdomDebug.add("warn","NPC movement blocked",world.residents[i].name+" at "+a.x.toFixed(2)+","+a.y.toFixed(2));a.path=[];a.nextRetry=now+1200}}}}const distance=Math.hypot(a.x-oldX,a.y-oldY);a.moving=distance>.001;if(a.moving){a.facing=KingdomPlayerFrames.resolveDirection(a.facing||"down",(a.x-oldX)/distance,(a.y-oldY)/distance);a.walkMs=(a.walkMs||0)+distance/1.6*1000}else a.walkMs=0});hauling.step((id,place)=>{const a=actors[id],g=goal(place,id);return Math.hypot(a.x-g[0],a.y-g[1])<.65});pets.forEach(p=>{let a=actors[p.owner],r=world.residents[p.owner],target=r.activity==='Taking a walk'?a: {x:goal(r.home,p.owner)[0],y:goal(r.home,p.owner)[1]};let dx=target.x-p.x,dy=target.y-p.y,d=Math.hypot(dx,dy);if(d>.8){let step=Math.min(d,1.8*dt*speed);let nx=p.x+dx/d*step,ny=p.y+dy/d*step;if(pass(nx,ny)){p.x=nx;p.y=ny}}});let s=world.snapshot();if(devMode&&$('debugpanel').style.display==='block')renderDebug();$('time').textContent='Day '+s.day+' · '+String(s.hour).padStart(2,'0')+':'+String(Math.min(59,Math.floor(clock.snapshot().accumulator/225*60))).padStart(2,'0')+(roomId?' · '+interiors.get(roomId).name:'');if(!roomId&&$('panel').style.display!=='block'){const nearby=interiors.nearPortal(player.x+facing[0]*.8,player.y+facing[1]*.8);if(nearby)$('hint').textContent='E / A: Enter '+nearby.name;else if($('hint').textContent.startsWith('E / A: Enter'))$('hint').textContent=''}$('stock').textContent='Dunmere is an independent settlement';$('activity').textContent='12 residents · '+s.transactions+' transactions · 2 pets';draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
